<!DOCTYPE html>
<html>

<head>

  <title>Creatina</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <style>

    body {

      background: #111;

      color: white;

      font-family: sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      height: 100vh;

      margin: 0;
    }

    .card {

      background: #1c1c1e;

      padding: 30px;

      border-radius: 25px;

      width: 280px;

      text-align: center;
    }

    h1 {

      margin-top: 0;
    }

    button {

      width: 100%;

      padding: 18px;

      border: none;

      border-radius: 18px;

      font-size: 20px;

      background: #E24B4A;

      color: white;
    }

  </style>

</head>

<body>

<div class="card">

  <h1>Creatina</h1>

  <button id="btn">
    ⬜️ No tomada
  </button>

</div>

<script>

const btn =
  document.getElementById("btn");

let taken =
  localStorage.getItem("creatina")
  === "true";

function render() {

  btn.innerText =
    taken
      ? "✅ Tomada"
      : "⬜️ No tomada";

  btn.style.background =
    taken
      ? "#2E7D32"
      : "#E24B4A";
}

render();

btn.onclick = () => {

  taken = !taken;

  localStorage.setItem(
    "creatina",
    taken
  );

  render();
};

</script>

</body>
</html>
